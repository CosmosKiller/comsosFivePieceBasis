# Cosmos security camera — Lovelace view (MJPEG stream wrapper)
#
# Camera entity: Settings → Devices & services → MJPEG IP Camera
#   URL: https://<device-ip>/stream  (Verify SSL: off for Beta self-signed cert)
#
# SKU 6 has no Matter camera entity — this view + package wrap the HTTP stream.
# Presence + siren entity ids land when firmware ships those endpoints.

title: Security cam
path: cosmos-security-cam
icon: mdi:cctv
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: switch.cosmos_security_camera # TODO: Matter OnOff stream gate
        state: "on"
    card:
      type: picture-entity
      entity: camera.cosmos_security_camera
      camera_view: live
      show_name: false
      show_state: false
      aspect_ratio: "16:10"

  - type: conditional
    conditions:
      - condition: state
        entity: switch.cosmos_security_camera # TODO
        state_not: "on"
    card:
      type: markdown
      content: |
        ### Camera idle
        Stream gate is Off. Tap **Open stream**, or wait for presence if auto-stream is on.

  - type: entities
    title: Security camera
    show_header_toggle: false
    entities:
      - entity: switch.cosmos_security_camera # TODO
        name: Live view (stream gate)
        icon: mdi:cctv
      - entity: binary_sensor.cosmos_security_camera_presence # TODO (espectre / CSI later)
        name: Presence
        icon: mdi:motion-sensor
      - entity: switch.cosmos_security_camera_siren # TODO (later)
        name: Siren / alarm (Off = silence)
        icon: mdi:alarm-bell
      - entity: input_boolean.cosmos_security_camera_auto_stream
        name: Auto-enable on presence
      - entity: input_number.cosmos_security_camera_stream_timeout_min
        name: Auto-off after

  - type: horizontal-stack
    cards:
      - type: button
        name: Open stream
        icon: mdi:video-outline
        tap_action:
          action: call-service
          service: switch.turn_on
          target:
            entity_id: switch.cosmos_security_camera # TODO
      - type: button
        name: Close stream
        icon: mdi:video-off-outline
        tap_action:
          action: call-service
          service: switch.turn_off
          target:
            entity_id: switch.cosmos_security_camera # TODO
      - type: button
        name: Silence siren
        icon: mdi:bell-off-outline
        tap_action:
          action: call-service
          service: switch.turn_off
          target:
            entity_id: switch.cosmos_security_camera_siren # TODO
