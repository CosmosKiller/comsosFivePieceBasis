# Cosmos door intercom — Lovelace door-station view (stock cards, no HACS)
#
# How to add
#   UI: Settings → Dashboards → Add dashboard (or edit existing) → Raw configuration
#       editor → paste this under `views:` (or merge the view object).
#   YAML mode: include from ui-lovelace.yaml / dashboards as you prefer.
#
# Replace every TODO entity id to match your commissioned Matter device.
# Camera entity: Settings → Devices & services → MJPEG IP Camera (not YAML).
#
# Design intent (gift / HA-native installs):
#   - Big live preview only while the stream gate is On (saves device load)
#   - One-tap enable / disable stream
#   - Doorbell + PIR + tamper status at a glance
#   - No custom JS card — upgrade later only if you need branded chrome

title: Door
path: cosmos-door
icon: mdi:doorbell-video
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: switch.cosmos_door_intercom # TODO: Matter OnOff stream gate
        state: "on"
    card:
      type: picture-entity
      entity: camera.cosmos_door_intercom
      camera_view: live
      show_name: false
      show_state: false
      aspect_ratio: "16:10"

  - type: conditional
    conditions:
      - condition: state
        entity: switch.cosmos_door_intercom # TODO
        state_not: "on"
    card:
      type: markdown
      content: |
        ### Camera idle
        Stream is off (Matter gate). Tap **Live view** below, or wait for
        doorbell / motion if auto-stream is enabled.

  - type: entities
    title: Door station
    show_header_toggle: false
    entities:
      - entity: switch.cosmos_door_intercom # TODO
        name: Live view (stream gate)
        icon: mdi:cctv
      - entity: binary_sensor.cosmos_door_intercom_occupancy # TODO
        name: Motion (PIR)
        icon: mdi:motion-sensor
      - entity: event.cosmos_door_intercom_doorbell # TODO: generic_switch event
        name: Doorbell
        icon: mdi:doorbell
      - entity: binary_sensor.cosmos_door_intercom_tamper # TODO: contact / Boolean State
        name: Tamper (mount open)
        icon: mdi:shield-alert
      - entity: input_boolean.cosmos_door_intercom_auto_stream
        name: Auto-enable on ring / motion
      - entity: input_number.cosmos_door_intercom_stream_timeout_min
        name: Auto-off after

  - type: horizontal-stack
    cards:
      - type: button
        name: Open stream
        icon: mdi:video-outline
        tap_action:
          action: call-service
          service: switch.turn_on
          target:
            entity_id: switch.cosmos_door_intercom # TODO
      - type: button
        name: Close stream
        icon: mdi:video-off-outline
        tap_action:
          action: call-service
          service: switch.turn_off
          target:
            entity_id: switch.cosmos_door_intercom # TODO
