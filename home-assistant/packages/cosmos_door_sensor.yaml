# Cosmos iotDoorSensor — battery alerts + Matter entity map (Matter Power Source)
#
# Loaded as package "cosmos_door_sensor" via !include_dir_named packages
# (filename = package name — do not add an extra top-level wrapper key).
#
# Matter endpoints (after commissioning — Developer tools → States):
#   - binary_sensor.* (contact) — reed open/closed
#   - switch.* (arm) — OnOff ON = arm exit-delay; OFF = disarm + clear panic/siren + confirm blink
#   - binary_sensor.* (panic) — read-only intrusion indicator (clears when reed closes)
#   - switch.* (siren) — OnOff ON = buzzer; OFF = silence (HA / Alexa / any automation)
#   - sensor.* — battery %
#
# Replace TODO entity ids and notify service after commissioning.
# HA commissioning / fleet OTA: https://github.com/CosmosKiller/cosmos-ha-field

input_boolean:
  cosmos_contact_low_battery_notified:
    name: Cosmos door sensor — low battery already notified
    icon: mdi:battery-alert

automation:
  - id: cosmos_contact_low_battery
    alias: "Cosmos door sensor — low battery warning"
    description: Notify when Matter battery % stays below threshold
    triggers:
      - trigger: numeric_state
        entity_id: sensor.cosmos_contact_battery # TODO: replace after commissioning
        below: 20
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: input_boolean.cosmos_contact_low_battery_notified
        state: "off"
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unknown', 'unavailable', 'none'] }}"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.cosmos_contact_low_battery_notified
      - action: notify.mobile_app_my_phone
        data:
          title: "Sensor de puerta Cosmos — batería baja"
          message: >-
            Batería al {{ states('sensor.cosmos_contact_battery') }}%.
            Cambia o carga la pila pronto.
          data:
            channel: alarm_stream
            importance: high
            ttl: 0
            priority: high

  - id: cosmos_contact_battery_recovered
    alias: "Cosmos door sensor — battery recovered (reset latch)"
    description: Allow low-battery alert again after charge or recovery
    triggers:
      - trigger: numeric_state
        entity_id: sensor.cosmos_contact_battery # TODO: replace after commissioning
        above: 25
        for:
          minutes: 5
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cosmos_contact_low_battery_notified
